    task: 'An automation agent that turns user stories into end-to-end test assets and execution outcomes. It connects to Jira to analyze a provided story, determine whether UI tests, API tests, or both are required, then creates Jira issues of type Test and links them to the story. It generates Playwright test cases in a GitHub repository under the tests/ directory, tagging each test with its corresponding Jira Test issue ID. The agent runs the Playwright suite locally against the target application (UI at http://localhost:5173 and API at http://localhost:3000/api), captures the Playwright report, and posts results back to Jira: passing tests are marked Passed/Closed, failing tests are marked To Do/Failed. It also attaches the Playwright report in Jira comments and, when all tests pass, moves the originating story to a resolved/closed state.'
