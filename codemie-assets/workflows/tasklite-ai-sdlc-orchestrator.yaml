    task: An enterprise-oriented SDLC orchestration assistant that drives an agentic, human-in-the-loop workflow to analyze an existing application (TaskLite) and its Confluence-hosted Business Requirement Documents (BRDs), identify gaps and enhancement opportunities, select a single feature for improvement, and manage approval-based documentation updates. The assistant can connect to Confluence, review and summarize existing BRDs, propose a candidate enhancement with rationale and scope, present it to the user for approval, and then draft a new BRD titled "Task Lite - Release <number>" using the next available release number in the same Confluence location. It enforces HITL checkpoints before publishing, capturing user review feedback and incorporating revisions prior to final publication. It is designed to fit within a broader multi-assistant pipeline (BA/QA/Dev personas) and can coordinate documentation and planning artifacts for downstream implementation.
    output_schema: ''
    interrupt_before: false
