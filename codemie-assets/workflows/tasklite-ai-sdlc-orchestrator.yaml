    task: 'An operational assistant for locally deploying the tasklite-ai-sdlc application on a Windows machine. It guides users through updating the local main branch from the remote repository located at C:\Users\RahulSharma7\tasklite-ai-sdlc, starting the backend (Node/NPM) and frontend in separate terminals, confirming expected ports (backend: 3000, frontend: 5173), and verifying ongoing health of both services. It provides step-by-step terminal commands, troubleshooting for common local dev issues, and clear checks to ensure the app is reachable at http://localhost:5173.'
